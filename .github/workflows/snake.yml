}name: Generate Snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jaredalvarezdev
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=D97757&color_dots=1E2530,2C3644,3A4658,485571,566688
            dist/snake.svg
      - name: Fix hex colors (add missing #)
        run: |
          sed -i -E 's/:(D97757|1E2530|2C3644|3A4658|485571|566688);/:#\1;/g' dist/snake-dark.svg
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
